id: ghost-phpmyadmin-unauth
info:
  name: PHPMyAdmin Unauthenticated Access
  author: sniper-predator
  severity: critical
  tags: exposure,phpmyadmin,database,critical,custom
http:
  - method: GET
    path:
      - "{{BaseURL}}/phpmyadmin/"
      - "{{BaseURL}}/pma/"
      - "{{BaseURL}}/dbadmin/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "server_databases.php"
          - "pma_navigation_tree_content"
          - "Structure"
          - "Databases"
          - "SQL query:"
        condition: or
      # ANTI-LOGIN TRAP: Jika masih muncul form login pma_username/pma_password, berarti BELUM tembus!
      - type: word
        words:
          - "pma_username"
          - "pma_password"
          - "input_username"
          - "input_password"
        condition: or
        negative: true

