id: ghost-jenkins-unauth
info:
  name: Jenkins Unauthenticated Script Console (RCE)
  author: sniper-predator
  severity: critical
  tags: exposure,jenkins,rce,critical,custom
http:
  - method: GET
    path:
      - "{{BaseURL}}/script"
      - "{{BaseURL}}/api/json"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "Script Console [Jenkins]"
          - "Groovy script and execute it"
          - '"_class":"hudson.model.Hudson"'
          - '"_class":"jenkins.model.Jenkins"'
        condition: or
      # ANTI-SPA TRAP: Cegah Next.js, Arena, dan halaman event matching
      - type: word
        words:
          - "_next/static"
          - "Jenkins Arena"
          - "Next.js"
        condition: or
        negative: true
