name: NOVA v2.4 - High-Yield Recon, Multi-Layer Verification & Report Pipeline

on:
  schedule:
    - cron: '11 */2 * * *'
    - cron: '41 1,5,9,13,17,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'targets/_focus.txt'
      - '.github/workflows/nova.yml'
  workflow_dispatch:
    inputs:
      programs:
        description: "Program terpisah koma (kosong = rotasi otomatis)"
        required: false
        default: ""
      rotate_count:
        description: "Jumlah program per run saat rotasi otomatis"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: nova
  cancel-in-progress: false

jobs:
  nova:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NOVA_MAX_CONC: "24"
      NOVA_REQ_DELAY: "0.06"
      NOVA_PER_HOST_CAP: "45"
      NOVA_MAX_NEW_PROBE: "250"
      NOVA_MAX_JS: "150"
      NOVA_DIFF_BUDGET: "60"
      NOVA_MONITOR_BUDGET: "90"
      NOVA_TAKEOVER_CAP: "2000"
      # Aktifkan bila menguji program Intigriti yang mewajibkan header peneliti:
      # NOVA_EXTRA_HEADERS: '{"X-Intigriti-Username":"${{ secrets.INTIGRITI_USERNAME }}"}'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_GENERAL_ID: ${{ secrets.TELEGRAM_GENERAL_ID }}
      TELEGRAM_DATA_ID: ${{ secrets.TELEGRAM_DATA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        run: |
          python3 -V
          python3 -m pip install --quiet --disable-pip-version-check requests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install subfinder (binary release, fallback go)
        timeout-minutes: 10
        run: |
          TAG=$(curl -sf "https://api.github.com/repos/projectdiscovery/subfinder/releases/latest" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))") || TAG=""
          if [ -n "$TAG" ]; then
            curl -sfL -o /tmp/sf.zip \
              "https://github.com/projectdiscovery/subfinder/releases/download/v${TAG}/subfinder_${TAG}_linux_amd64.zip" \
              && unzip -oq /tmp/sf.zip -d /tmp/sf \
              && sudo install /tmp/sf/subfinder /usr/local/bin/subfinder || true
          fi
          if ! command -v subfinder >/dev/null 2>&1; then
            echo "[fallback] compile via go..."
            sudo apt-get update -qq && sudo apt-get install -y -qq golang
            GOBIN=/usr/local/bin go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest \
              || echo "[!] subfinder gagal dipasang - NOVA lanjut dengan sumber pasif python"
          fi
          subfinder -version || true

      - name: Pilih program (rotasi otomatis / _focus.txt / manual)
        id: pick
        run: |
          if [ -f targets/_focus.txt ]; then
            FOCUS=$(tr -d '\r' < targets/_focus.txt | grep -v '^[[:space:]]*#' | sed 's/[[:space:]]//g' | grep -v '^$' || true)
          else
            FOCUS=""
          fi
          if [ -n "$FOCUS" ]; then
            ALL="$FOCUS"
          else
            ALL=$(ls targets/*.txt | sed 's|targets/||; s|\.txt$||' | grep -v '^test_target$' | grep -v '^_' | sort)
          fi
          N=$(echo "$ALL" | wc -l)
          K="${{ github.event.inputs.rotate_count || '12' }}"
          K=$(( K + 0 )); [ "$K" -lt 1 ] && K=12
          if [ -n "${{ github.event.inputs.programs }}" ]; then
            PROGS="${{ github.event.inputs.programs }}"
          elif [ "$N" -le "$K" ]; then
            PROGS=$(echo "$ALL" | paste -sd, -)
          else
            OFFSET=$(( ${{ github.run_number }} * K % N ))
            PROGS=""
            for i in $(seq 0 $((K-1))); do
              IDX=$(( (OFFSET + i) % N + 1 ))
              PROGS="$PROGS,$(sed -n "${IDX}p" <<< "$ALL")"
            done
            PROGS="${PROGS#,}"
          fi
          echo "programs=$PROGS" >> "$GITHUB_OUTPUT"
          {
            echo "### NOVA v2.4 run #${{ github.run_number }}"
            echo "- Program aktif di _focus.txt: **$N**"
            echo "- Diproses pada batch ini (target $K): \`$PROGS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: NOVA - monitor/probe/verify/diff per program (36m soft deadline)
        run: |
          START_TS=$(date +%s)
          IFS=',' read -ra PROGS <<< "${{ steps.pick.outputs.programs }}"
          DONE_CNT=0
          for P in "${PROGS[@]}"; do
            ELAPSED=$(( $(date +%s) - START_TS ))
            if [ "$ELAPSED" -gt 2160 ]; then
              echo "[time-guard] Sudah berjalan ${ELAPSED}s (>36m). Hentikan loop dengan aman agar brief & commit state selalu tuntas."
              break
            fi
            P=$(echo "$P" | xargs)
            [ -z "$P" ] && continue
            [ -f "targets/$P.txt" ] || { echo "[skip] targets/$P.txt tidak ada"; continue; }
            echo "=============== NOVA: $P ==============="
            mkdir -p "data/$P"
            tr -d '\r' < "targets/$P.txt" | grep -v '^[[:space:]]*[#!]' | sed 's/^\*\.//' | sed '/^[[:space:]]*$/d' > "data/$P/subfinder_roots.txt" || true
            if [ -s "data/$P/subfinder_roots.txt" ]; then
              timeout 90s subfinder -dL "data/$P/subfinder_roots.txt" -all -silent -max-time 1 -o "data/$P/subfinder.txt" 2>/dev/null || true
            fi
            python3 scripts/nova.py monitor --program "$P" --merge-file "data/$P/subfinder.txt"
            python3 scripts/nova.py probe --program "$P"
            python3 scripts/nova.py verify --program "$P"
            python3 scripts/nova.py diff --program "$P"
            rm -rf "data/$P"
            DONE_CNT=$(( DONE_CNT + 1 ))
          done
          echo "- Selesai diproses penuh: **$DONE_CNT** program" >> "$GITHUB_STEP_SUMMARY"

      - name: Briefing + Telegram (hanya jika ada lead valid)
        if: always()
        run: python3 scripts/nova.py brief --send-telegram

      - name: Commit memory aset (state/)
        if: always()
        run: |
          git config --local user.email "bot@nova-recon"
          git config --local user.name "Nova-Bot"
          mkdir -p state
          git add state/
          git commit -m "nova: sync asset state" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull origin main --rebase || (git rebase --abort || true)
            if git push origin main; then
              echo "Memory tersinkron."
              break
            fi
            echo "Tabrakan push, coba lagi ($i)..."
            sleep 10
          done
